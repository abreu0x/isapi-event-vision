[project]
name = "isapi-event-vision"
version = "0.1.0"
description = "Consome eventos Hikvision ISAPI, processa snapshots com OpenCV e classifica por pipeline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Otavio Abreu", email = "abreu0x.dev@gmail.com" }]
keywords = ["hikvision", "isapi", "computer-vision", "ip-camera", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2.13",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isapi_event_vision"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=isapi_event_vision --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
